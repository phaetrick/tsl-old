# Increase memory for faster C++ linking and Kotlin compilation
org.gradle.jvmargs=-Xmx8192m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Core Performance Features
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
# This is the big one - makes subsequent builds nearly instant
org.gradle.configuration-cache=true

# AndroidX is the standard
android.useAndroidX=true

# Fixes the warning you saw earlier
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false